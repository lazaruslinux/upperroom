###############################################################################
# upperroom MediaMTX configuration
#
# MediaMTX receives the stream from OBS over RTMP and republishes it as low
# latency HLS for the browser player. It does not transcode, it only
# repackages, so it stays light on a small server.
###############################################################################

# Control API, used by the gate service to tell viewers whether the stream is
# live. It listens only inside the docker network.
api: yes
apiAddress: :9997

# RTSP, used only inside the docker network as the read path for the recorder and
# the preview thumbnail. It is NOT published to the host (see docker-compose.yml),
# so nothing outside the compose network can reach it, and reads still go through
# the same gate auth callback as everything else. Reading those two internal
# consumers back over RTMP means opening a second RTMP client session against our
# own server, which dies mid-demux on a loaded machine and leaves recording
# stalled at zero bytes while HLS carries on fine. TCP only, so no UDP/RTP or
# multicast listeners are bound.
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

# Protocols we do not use. MoQ defaults to on and binds a TCP and a UDP listener
# even though nothing here speaks it, so it is turned off rather than left to
# listen for the life of the server.
webrtc: no
srt: no
moq: no

# RTMP ingest from OBS.
rtmp: yes
rtmpAddress: :1935

# Low latency HLS output. Caddy is the only thing that reaches this, inside the
# docker network.
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsAlwaysRemux: no
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAllowOrigins: ['*']

# Publish auth is delegated to the gate over HTTP: MediaMTX POSTs each new
# connection to the address below, and a 2xx allows it. The gate checks a publish
# against the stream key stored in its database (editable on the admin
# dashboard), and allows reads only from inside the container network, the same
# rule the old static ips allowlist enforced. Because auth is per-connection,
# rotating the stream key never interrupts a broadcast already in progress: it
# only applies to the next connect. authHTTPExclude keeps the control API,
# metrics, and pprof off the callback, so the gate's own status polls do not loop
# back through it (api must stay exempt).
authMethod: http
authHTTPAddress: http://gate:8000/mtx-auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

paths:
  live:
