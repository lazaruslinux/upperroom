# selfstream runs as three small containers:
#
#   mediamtx  receives the stream from OBS and republishes it as HLS
#   gate      handles login, the session cookie, chat, and presence
#   caddy     terminates TLS, serves the pages, and guards the video
#
# Every value in ${...} comes from your local .env file, which is never
# committed. Copy .env.example to .env and fill it in before starting.

services:
  mediamtx:
    # Pinned: the HTTP auth contract the gate relies on (the callback payload
    # fields) is version-specific, so an unattended :latest bump could break
    # publish auth.
    image: bluenviron/mediamtx:1.19.1
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      # RTMP ingest from OBS. Lock this port to your home IP with the firewall
      # (see docs/01-vps-setup.md). Nobody else should be able to publish.
      - "1935:1935"
    networks:
      - selfstream

  gate:
    build: ./gate
    restart: unless-stopped
    environment:
      - SELFSTREAM_JWT_SECRET=${SELFSTREAM_JWT_SECRET}
      # Seeds the stream key on first start so an existing install and the demo
      # keep publishing across the switch to gate-delegated auth. Only used while
      # the key is still unset; once a key exists, changing this does nothing.
      - PUBLISH_PASS=${PUBLISH_PASS:-}
      - SELFSTREAM_SESSION_HOURS=${SELFSTREAM_SESSION_HOURS:-6}
      - SELFSTREAM_PATH=live
      - MEDIAMTX_API=http://mediamtx:9997
      - SELFSTREAM_DB=/data/selfstream.db
      - SELFSTREAM_CHAT_RETENTION_DAYS=${SELFSTREAM_CHAT_RETENTION_DAYS:-7}
      - SELFSTREAM_THUMB_INTERVAL=${SELFSTREAM_THUMB_INTERVAL:-15}
      # Where the gate pulls a frame for the home card preview thumbnail.
      - SELFSTREAM_RTMP_SOURCE=rtmp://mediamtx:1935/live
      # Recordings are written to local scratch while live, then archived to the
      # media store. Retention lives in the admin dashboard; these two are read
      # only once, to seed it when updating an install that predates it.
      - SELFSTREAM_RECORD_TMP=/rec
      - SELFSTREAM_MEDIA_DIR=/media
      - SELFSTREAM_VOD_KEEP=${SELFSTREAM_VOD_KEEP:-20}
      - SELFSTREAM_VOD_KEEP_DAYS=${SELFSTREAM_VOD_KEEP_DAYS:-0}
      # Go-live notifications (all optional; blank values disable a channel).
      - SELFSTREAM_SITE_URL=${SELFSTREAM_SITE_URL:-}
      - SELFSTREAM_NOTIFY_COOLDOWN=${SELFSTREAM_NOTIFY_COOLDOWN:-1800}
      - SELFSTREAM_SMTP_HOST=${SELFSTREAM_SMTP_HOST:-}
      - SELFSTREAM_SMTP_PORT=${SELFSTREAM_SMTP_PORT:-587}
      - SELFSTREAM_SMTP_USER=${SELFSTREAM_SMTP_USER:-}
      - SELFSTREAM_SMTP_PASS=${SELFSTREAM_SMTP_PASS:-}
      - SELFSTREAM_SMTP_FROM=${SELFSTREAM_SMTP_FROM:-}
    volumes:
      - gate_data:/data
      - rec_scratch:/rec
      # The media store (recordings and clips). By default a local docker volume,
      # so a fresh checkout just works. To keep recordings on a big disk or a NAS
      # instead, override the source of this mount in an uncommitted
      # docker-compose.override.yml (see docs/04-run.md).
      - media_data:/media
    networks:
      - selfstream

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      - SELFSTREAM_DOMAIN=${SELFSTREAM_DOMAIN}
      - TLS_EMAIL=${TLS_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      # Read-only view of the same media store the gate writes to, so Caddy can
      # serve the recording and clip files directly.
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - selfstream
    depends_on:
      - gate
      - mediamtx

  # ---- Demo mode (profile "demo") -------------------------------------------
  # These two services only run with `docker compose --profile demo up -d`. The
  # default `docker compose up -d` never starts them, so a real install is
  # unaffected. Together they bring the site up already alive: demo accounts
  # exist and a synthetic broadcast is already streaming. See docs/07-demo.md.

  # One-shot seeder. Reuses the gate image, shares the gate's data volume, and
  # idempotently creates the demo accounts, stream title, and invite code, then
  # exits. Safe to re-run; it refuses to touch a database that already has real
  # (non-demo) accounts.
  demo-seed:
    profiles: ["demo"]
    build: ./gate
    command: ["python", "demo_seed.py"]
    environment:
      - SELFSTREAM_DB=/data/selfstream.db
      - DEMO_ADMIN_USER=${DEMO_ADMIN_USER:-demo}
      - DEMO_ADMIN_PASSWORD=${DEMO_ADMIN_PASSWORD:-demodemo123}
    volumes:
      - gate_data:/data
    depends_on:
      - gate

  # Synthetic broadcaster. Loops an ffmpeg publish of an animated 720p30 source
  # with audio into MediaMTX, so the watch page shows live video. It publishes
  # with PUBLISH_PASS, which the gate seeds into the stream key on first start,
  # so the demo authenticates without any dashboard step. The shell loop retries
  # with a short backoff so it survives MediaMTX starting slowly.
  demo-stream:
    profiles: ["demo"]
    image: linuxserver/ffmpeg:latest
    restart: unless-stopped
    environment:
      - PUBLISH_PASS=${PUBLISH_PASS}
    entrypoint: ["/bin/sh", "-c"]
    # $$PUBLISH_PASS is escaped so Compose leaves it for the container shell to
    # expand at runtime from the environment above, keeping the password out of
    # the rendered config. Modest 1500k bitrate, keyframe every 2s (-g 60 at
    # 30fps), no B-frames (this app's HLS muxer breaks on B-frame reordering).
    command:
      - |
        while true; do
          echo "demo-stream: starting ffmpeg publish to mediamtx"
          ffmpeg -hide_banner -loglevel warning \
            -re -f lavfi -i "mandelbrot=size=1280x720:rate=30" \
            -f lavfi -i "sine=frequency=220:sample_rate=48000" \
            -filter:a "volume=0.08" \
            -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p \
            -b:v 1500k -maxrate 1500k -bufsize 3000k \
            -g 60 -keyint_min 60 -sc_threshold 0 -bf 0 \
            -c:a aac -b:a 128k -ar 48000 \
            -f flv "rtmp://mediamtx:1935/live?user=publisher&pass=$$PUBLISH_PASS"
          echo "demo-stream: ffmpeg exited, retrying in 3s"
          sleep 3
        done
    networks:
      - selfstream
    depends_on:
      - mediamtx

networks:
  selfstream:

volumes:
  gate_data:
  rec_scratch:
  media_data:
  caddy_data:
  caddy_config:
