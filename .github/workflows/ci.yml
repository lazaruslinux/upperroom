name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            gate/requirements.txt
            gate/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r gate/requirements.txt -r gate/requirements-dev.txt
      - name: Run tests
        run: pytest gate/tests/ -q
