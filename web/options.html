<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>upperroom - options</title>
  <script>
    // Apply the saved theme before first paint so the page never flashes.
    try { document.documentElement.dataset.theme = localStorage.getItem("selfstream_theme") || "dark"; } catch (e) {}
    // Apply the saved accent flavor too, so the brand color never flashes.
    try { document.documentElement.dataset.accent = localStorage.getItem("selfstream_accent") || "green"; } catch (e) {}
  </script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg?v=1">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=1">
  <link rel="manifest" href="/api/manifest.webmanifest">
  <meta name="theme-color" content="#0b0c0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/assets/style.css?v=63">
</head>
<body class="options">
  <div id="site-nav"></div>

  <main class="options-main">
    <section class="options-section">
      <h2>appearance</h2>
      <div class="settings-rows">
        <div class="setting">
          <span>Theme</span>
          <button id="theme-toggle" type="button" class="pill">Dark</button>
        </div>
      </div>
    </section>

    <!-- Go-live email is a viewer setting. The server never emails admins that
         their own stream is live, so this whole section is hidden for them
         rather than offering a control that cannot do anything. -->
    <section id="notify-section" class="options-section" hidden>
      <h2>go-live notifications</h2>
      <div class="settings-rows">
        <div class="setting setting-field">
          <span>Go-live email</span>
          <div class="field-edit">
            <input id="email-input" type="email" placeholder="name@example.com" autocomplete="email">
            <button id="email-save" type="button" class="pill">Save</button>
          </div>
        </div>
        <div class="setting setting-check">
          <label class="switch">
            <input id="notify-toggle" type="checkbox">
            Receive an email when streams start
          </label>
        </div>
      </div>
    </section>

    <section class="options-section">
      <h2>profile</h2>
      <div class="settings-rows">
        <div class="setting setting-field">
          <span>Display name</span>
          <div class="field-edit">
            <input id="name-input" type="text" maxlength="40" placeholder="Shown in chat" autocomplete="off">
            <button id="name-save" type="button" class="pill">Save</button>
          </div>
        </div>
        <div class="setting">
          <span>Avatar</span>
          <span class="avatar-edit">
            <span id="my-avatar"></span>
            <button id="avatar-button" type="button" class="pill">Change</button>
            <input id="avatar-input" type="file" accept="image/*" hidden>
          </span>
        </div>
        <div class="setting setting-field">
          <span>Bio</span>
          <div class="field-edit">
            <textarea id="bio-input" maxlength="200" rows="2" placeholder="A short bio others see when they tap your avatar"></textarea>
            <button id="bio-save" type="button" class="pill">Save</button>
          </div>
        </div>
      </div>
    </section>

    <section class="options-section">
      <h2>change password</h2>
      <div class="pw-edit">
        <input id="pw-current" type="password" placeholder="Current password" autocomplete="current-password">
        <input id="pw-new" type="password" placeholder="New password (8+ characters)" autocomplete="new-password">
        <div class="pw-row">
          <button id="pw-save" type="button" class="pill primary">Change password</button>
          <span id="pw-msg" class="pw-msg"></span>
        </div>
      </div>
    </section>
  </main>

  <!-- Picking an avatar file opens this over the page: the same square crop
       stage the settings modal used to carry. -->
  <div id="crop-modal" class="modal" hidden>
    <div class="modal-card crop-card">
      <div class="crop-stage">
        <canvas id="crop-canvas" width="256" height="256"></canvas>
        <div class="crop-ring"></div>
      </div>
      <input id="crop-zoom" type="range" min="1" max="3" step="0.01" value="1" aria-label="Zoom">
      <div class="crop-actions">
        <button type="button" class="pill" data-close>Cancel</button>
        <button id="crop-save" type="button" class="pill primary">Save</button>
      </div>
    </div>
  </div>

  <footer class="site-foot mono muted">
    <img class="foot-logo" src="/assets/icons/icon.svg?v=1" alt="" aria-hidden="true">
    <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener">AGPL-3.0</a>
    <span class="powered-sep">·</span>
    <span>developed by <a href="https://lazaruslinux.com" target="_blank" rel="noopener">Lazarus Labs</a></span>
  </footer>

  <script src="/assets/nav.js?v=9"></script>
  <script src="/assets/options.js?v=2"></script>
</body>
</html>
