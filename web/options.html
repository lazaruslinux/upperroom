<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>upperroom</title>
  <script src="/assets/head.js?v=2"></script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg?v=1">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=1">
  <link rel="manifest" href="/api/manifest.webmanifest">
  <meta name="theme-color" content="#0c0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/assets/style.css?v=65">
</head>
<body class="options">
  <div id="site-nav"></div>

  <main class="page">
    <h1 class="page-title">Options</h1>

    <!-- How your own lines look to the room. Saved on your account, so they
         ride along on your messages for everyone. -->
    <section class="options-section" aria-labelledby="style-title">
      <h2 id="style-title" class="engraved">Chat style</h2>
      <div class="settings-rows">
        <div class="setting setting-field">
          <span class="setting-label">Font</span>
          <div id="font-picker" class="font-picker" role="group" aria-label="Chat font"></div>
        </div>
        <div class="setting setting-field">
          <span class="setting-label">Colors</span>
          <div class="color-pickers">
            <label class="color-pick">Name <input id="name-color" type="color"></label>
            <label class="color-pick">Text <input id="msg-color" type="color"></label>
            <button id="color-reset" type="button" class="btn">Reset</button>
          </div>
          <p id="color-msg" class="pw-msg" role="status"></p>
        </div>
        <!-- A mock of your own chat line, so a font and color pick can be seen
             the way the room will see it before anything is sent. -->
        <div id="font-preview" class="font-preview" aria-label="Preview"></div>
      </div>
    </section>

    <!-- The go-live push, for this device only. It goes through the
         browser's own push service; the permission prompt appears only after
         the switch is tapped. -->
    <section class="options-section" aria-labelledby="push-title">
      <h2 id="push-title" class="engraved">Notifications</h2>
      <div class="settings-rows">
        <div class="setting setting-field">
          <div class="setting">
            <span class="setting-label" id="push-label">Notify this device when the stream goes live</span>
            <button id="push-toggle" type="button" class="toggle" role="switch" aria-checked="false" aria-labelledby="push-label" disabled></button>
          </div>
          <p id="push-status" class="setting-hint" role="status"></p>
        </div>
      </div>
    </section>

    <section class="options-section" aria-labelledby="profile-title">
      <h2 id="profile-title" class="engraved">Profile</h2>
      <div class="settings-rows">
        <div class="setting setting-field">
          <label class="setting-label" for="name-input">Name in chat</label>
          <div class="field-edit">
            <input id="name-input" class="field" type="text" maxlength="40" autocomplete="nickname">
            <button id="name-save" type="button" class="btn">Save</button>
          </div>
        </div>
        <div class="setting">
          <span class="setting-label">Picture</span>
          <span class="avatar-edit">
            <span id="my-avatar"></span>
            <button id="avatar-button" type="button" class="btn">Change</button>
            <input id="avatar-input" type="file" accept="image/*" hidden>
          </span>
        </div>
        <div class="setting setting-field">
          <label class="setting-label" for="bio-input">Bio</label>
          <div class="field-edit">
            <textarea id="bio-input" maxlength="200" rows="2" placeholder="A line or two people see when they tap your name"></textarea>
            <button id="bio-save" type="button" class="btn">Save</button>
          </div>
        </div>
      </div>
    </section>

    <section class="options-section" aria-labelledby="pw-title">
      <h2 id="pw-title" class="engraved">Password</h2>
      <div class="pw-edit">
        <input id="pw-current" class="field" type="password" placeholder="Current password" autocomplete="current-password" aria-label="Current password">
        <input id="pw-new" class="field" type="password" placeholder="New password, 8 characters or more" autocomplete="new-password" aria-label="New password">
        <div class="pw-row">
          <button id="pw-save" type="button" class="btn primary">Change password</button>
          <span id="pw-msg" class="pw-msg" role="status"></span>
        </div>
      </div>
    </section>
  </main>

  <!-- Picking a picture opens this over the page: a square crop stage. -->
  <div id="crop-modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="crop-title">
      <h3 id="crop-title">Crop your picture</h3>
      <div class="crop-stage">
        <canvas id="crop-canvas" width="256" height="256"></canvas>
        <div class="crop-ring"></div>
      </div>
      <input id="crop-zoom" type="range" min="1" max="3" step="0.01" value="1" aria-label="Zoom">
      <div class="modal-actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button id="crop-save" type="button" class="btn primary">Save</button>
      </div>
    </div>
  </div>

  <footer class="site-foot">
    <img class="foot-logo" src="/assets/icons/icon.svg?v=1" alt="">
    <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener">AGPL-3.0</a>
    <span class="powered-sep" aria-hidden="true">·</span>
    <span>developed by <a href="https://lazaruslinux.com" target="_blank" rel="noopener">Lazarus Labs</a></span>
  </footer>

  <script src="/assets/nav.js?v=12"></script>
  <script src="/assets/push.js?v=1"></script>
  <script src="/assets/options.js?v=3"></script>
</body>
</html>
