<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>upperroom - analytics</title>
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem("selfstream_theme") || "dark"; } catch (e) {}
    // Apply the saved accent flavor too, so the brand color never flashes.
    try { document.documentElement.dataset.accent = localStorage.getItem("selfstream_accent") || "green"; } catch (e) {}
  </script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg?v=1">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=1">
  <link rel="manifest" href="/api/manifest.webmanifest">
  <meta name="theme-color" content="#0b0c0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/assets/style.css?v=36">
</head>
<body class="admin">
  <div id="site-nav"></div>

  <main class="admin-main">
    <h2 class="section-title">At a glance</h2>
    <section class="stat-strip" id="stat-strip"></section>

    <h2 class="section-title" style="margin-top:1.75rem;">Most watch time</h2>
    <div id="watch-board" class="activity-list"></div>
    <p id="watch-empty" class="muted" hidden>Nobody has watched a live stream yet.</p>

    <h2 class="section-title" style="margin-top:1.75rem;">Broadcasts</h2>
    <div id="broadcasts" class="activity-list"></div>
    <p id="broadcast-empty" class="muted" hidden>No recorded broadcasts yet.</p>

    <h2 class="section-title" style="margin-top:1.75rem;">Library</h2>
    <section class="stat-strip" id="library-strip"></section>

    <h2 class="section-title" style="margin-top:1.75rem;">Invites</h2>
    <section class="stat-strip" id="invite-strip"></section>
  </main>

  <script src="/assets/nav.js?v=3"></script>
  <script src="/assets/analytics.js?v=2"></script>
</body>
</html>
