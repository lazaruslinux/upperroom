<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>upperroom - stats</title>
  <script src="/assets/head.js?v=2"></script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg?v=1">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=1">
  <link rel="manifest" href="/api/manifest.webmanifest">
  <meta name="theme-color" content="#0c0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/assets/style.css?v=66">
  <link rel="stylesheet" href="/assets/dash.css?v=3">
</head>
<body class="dash">
  <div id="site-nav"></div>

  <main class="dash-main">
    <div class="dash-page wide">
      <h1 class="page-title">Stats</h1>

      <!-- Only what the app already keeps. There is no count of people
           watching over time: presence lives in memory and is never written
           down, so no chart pretends otherwise. -->
      <div class="meter-row" id="people-meters" aria-label="At a glance"></div>

      <section class="dash-group" aria-labelledby="days-title">
        <div class="group-head">
          <h2 id="days-title" class="engraved">The last 30 days</h2>
        </div>
        <div id="charts" class="charts"></div>
      </section>

      <section class="dash-group" aria-labelledby="board-title">
        <div class="group-head">
          <h2 id="board-title" class="engraved">Most watch time</h2>
        </div>
        <ul id="watch-board" class="rows" aria-labelledby="board-title"></ul>
        <p id="watch-empty" class="empty" hidden>Nobody has watched a live stream yet.</p>
      </section>

      <section class="dash-group" aria-labelledby="bc-title">
        <div class="group-head">
          <h2 id="bc-title" class="engraved">Broadcasts</h2>
        </div>
        <ul id="broadcasts" class="rows" aria-labelledby="bc-title"></ul>
        <p id="broadcast-empty" class="empty" hidden>No recorded broadcasts yet.</p>
      </section>

      <section class="dash-group" aria-labelledby="lib-title">
        <div class="group-head">
          <h2 id="lib-title" class="engraved">Library</h2>
        </div>
        <div class="meter-row flush" id="library-meters"></div>
      </section>

      <section class="dash-group" aria-labelledby="inv-title">
        <div class="group-head">
          <h2 id="inv-title" class="engraved">Invite codes</h2>
        </div>
        <div class="meter-row flush" id="invite-meters"></div>
      </section>
    </div>
  </main>

  <footer class="site-foot">
    <img class="foot-logo" src="/assets/icons/icon.svg?v=1" alt="">
    <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener">AGPL-3.0</a>
    <span class="powered-sep" aria-hidden="true">·</span>
    <span>developed by <a href="https://lazaruslinux.com" target="_blank" rel="noopener">Lazarus Labs</a></span>
  </footer>

  <script src="/assets/nav.js?v=13"></script>
  <script src="/assets/analytics.js?v=5"></script>
</body>
</html>
