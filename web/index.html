<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>upperroom</title>
  <script src="/assets/head.js?v=2"></script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg?v=1">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=1">
  <link rel="manifest" href="/api/manifest.webmanifest">
  <meta name="theme-color" content="#0c0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- How the site looks when someone pastes the link into a chat. Static, and
       so deliberately generic: a crawler does not run JavaScript, and this page
       is public, so it says upperroom rather than the operator's own name. The
       watch page is the one that is actually shared, and the gate renders its
       tags live (see gate/routes/media.py). The gate also serves this page as
       /join, an invite link, and rewrites everything between the two markers
       with an invite card. -->
  <!-- og:start -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="upperroom">
  <meta property="og:description" content="A private livestream. Sign in to watch.">
  <meta property="og:image" content="/assets/icons/og-default.png?v=1">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <!-- og:end -->
  <link rel="stylesheet" href="/assets/style.css?v=66">
</head>
<body class="door-page">
  <div id="site-nav"></div>

  <main class="door">
    <h1 class="door-title"><span id="door-name">upperroom</span><span id="door-sub" class="door-sub">&nbsp;</span></h1>

    <form id="login-form" class="door-form">
      <label class="field-label">
        <span class="engraved">Username</span>
        <input type="text" id="username" class="field" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="field-label">
        <span class="engraved">Password</span>
        <input type="password" id="password" class="field" autocomplete="current-password" required>
      </label>
      <button type="submit" class="loud">Sign in</button>
      <p id="error" class="error" role="alert" hidden></p>
    </form>

    <form id="register-form" class="door-form" autocomplete="off" hidden>
      <label class="field-label">
        <span class="engraved">Invite code</span>
        <input type="text" id="r-code" class="field" autocomplete="off" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="field-label">
        <span class="engraved">Username</span>
        <input type="text" id="r-username" class="field" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="field-label">
        <span class="engraved">Name in chat</span>
        <input type="text" id="r-name" class="field" autocomplete="nickname" required>
      </label>
      <label class="field-label">
        <span class="engraved">Password, 8 characters or more</span>
        <input type="password" id="r-password" class="field" autocomplete="new-password" required>
      </label>
      <button type="submit" class="loud">Join</button>
      <p id="r-error" class="error" role="alert" hidden></p>
    </form>

    <p class="door-alt">
      <button type="button" id="show-register" class="link-btn">Have an invite code?</button>
      <button type="button" id="show-login" class="link-btn" hidden>Back to sign in</button>
    </p>
  </main>

  <footer class="site-foot">
    <img class="foot-logo" src="/assets/icons/icon.svg?v=1" alt="">
    <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener">AGPL-3.0</a>
    <span class="powered-sep" aria-hidden="true">·</span>
    <span>developed by <a href="https://lazaruslinux.com" target="_blank" rel="noopener">Lazarus Labs</a></span>
  </footer>
  <script src="/assets/nav.js?v=13"></script>
  <script src="/assets/gate.js?v=22"></script>
</body>
</html>
