<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lazarus Labs</title>
  <script>
    // Apply the saved theme before first paint so the page never flashes.
    try { document.documentElement.dataset.theme = localStorage.getItem("selfstream_theme") || "dark"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="center">
  <main class="card">
    <div id="status" class="status status-loading">
      <span class="dot"></span>
      <span id="status-label">Checking status…</span>
      <span id="status-time" class="status-time"></span>
    </div>
    <h1>Lazarus Labs</h1>
    <p class="muted">Sign in</p>
    <form id="login-form" autocomplete="off">
      <input type="text" id="username" placeholder="Username" autocomplete="off" required>
      <input type="password" id="password" placeholder="Password" autocomplete="new-password" required>
      <button type="submit">Sign in</button>
      <p id="error" class="error" hidden></p>
    </form>
  </main>
  <script src="/assets/gate.js?v=11"></script>
</body>
</html>
