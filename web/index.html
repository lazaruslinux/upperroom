<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>upperroom</title>
  <script>
    // Apply the saved theme before first paint so the page never flashes.
    try { document.documentElement.dataset.theme = localStorage.getItem("selfstream_theme") || "dark"; } catch (e) {}
    // Apply the saved accent flavor too, so the brand color never flashes.
    try { document.documentElement.dataset.accent = localStorage.getItem("selfstream_accent") || "green"; } catch (e) {}
  </script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg?v=1">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=1">
  <link rel="manifest" href="/api/manifest.webmanifest">
  <meta name="theme-color" content="#0b0c0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- How the site looks when someone pastes the link into a chat. Only this
       page needs them: every other page is behind the sign in and will never be
       scraped. A crawler does not run JavaScript, so this says upperroom rather
       than the operator's own name, which the pages themselves fill in. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="upperroom">
  <meta property="og:description" content="A private livestream. Sign in to watch.">
  <meta property="og:image" content="/assets/icons/og-default.png?v=1">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/style.css?v=49">
</head>
<body class="center">
  <main class="card">
    <div id="status" class="status status-loading">
      <span class="dot"></span>
      <span id="status-label">Checking status…</span>
      <span id="status-time" class="status-time"></span>
      <span id="status-watching" class="status-watching"></span>
    </div>
    <p id="next-stream" class="next-stream" hidden>
      <span id="next-count"></span>
      <span id="next-when" class="next-when"></span>
    </p>
    <div class="masthead">
      <h1 class="site-title" id="site-title">upperroom</h1>
      <p class="powered">powered by <a class="brand-link" href="https://lazaruslinux.com" target="_blank" rel="noopener" title="Lazarus Labs"><span class="wordmark">upper<span class="wm-accent">room</span></span></a></p>
    </div>
    <p class="muted">sign in</p>
    <form id="login-form">
      <input type="text" id="username" placeholder="Username" autocomplete="username" required>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <p id="error" class="error" hidden></p>
    </form>

    <p class="alt-toggle" id="invite-alt">
      <button type="button" id="show-register">enter invite code</button>
      <a href="/guest" class="guest-alt">enter guest pass</a>
    </p>

    <form id="register-form" autocomplete="off" hidden>
      <p class="muted">redeem an invite</p>
      <input type="text" id="r-code" placeholder="Invite code" autocomplete="off" required>
      <input type="text" id="r-username" placeholder="Username" autocomplete="off" required>
      <input type="text" id="r-name" placeholder="Display name" autocomplete="off" required>
      <input type="password" id="r-password" placeholder="Password (at least 8 characters)" autocomplete="new-password" required>
      <button type="submit">Join</button>
      <p id="r-error" class="error" hidden></p>
      <p class="alt-toggle">
        <button type="button" id="show-login">back to sign in</button>
      </p>
    </form>
  </main>

  <footer class="site-foot mono muted">
    <img class="foot-logo" src="/assets/icons/icon.svg?v=1" alt="" aria-hidden="true">
    <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener">AGPL-3.0</a>
    <span class="powered-sep">·</span>
    <span>developed by <a href="https://lazaruslinux.com" target="_blank" rel="noopener">Lazarus Labs</a></span>
  </footer>
  <script src="/assets/gate.js?v=20"></script>
</body>
</html>
