<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>upperroom</title>
  <script>
    // Apply the saved theme before first paint so the page never flashes.
    try { document.documentElement.dataset.theme = localStorage.getItem("selfstream_theme") || "dark"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/assets/style.css?v=18">
</head>
<body class="center">
  <main class="card">
    <div id="status" class="status status-loading">
      <span class="dot"></span>
      <span id="status-label">Checking status…</span>
      <span id="status-time" class="status-time"></span>
    </div>
    <h1 class="brand">upperroom<span class="cursor">▮</span></h1>
    <p class="muted">&gt; sign in</p>
    <form id="login-form" autocomplete="off">
      <input type="text" id="username" placeholder="Username" autocomplete="off" required>
      <input type="password" id="password" placeholder="Password" autocomplete="new-password" required>
      <button type="submit">Sign in</button>
      <p id="error" class="error" hidden></p>
    </form>

    <p class="alt-toggle">
      <button type="button" id="show-register">have an invite?</button>
    </p>

    <form id="register-form" autocomplete="off" hidden>
      <p class="muted">&gt; redeem an invite</p>
      <input type="text" id="r-code" placeholder="Invite code" autocomplete="off" required>
      <input type="text" id="r-username" placeholder="Username" autocomplete="off" required>
      <input type="text" id="r-name" placeholder="Display name" autocomplete="off" required>
      <input type="password" id="r-password" placeholder="Password (at least 8 characters)" autocomplete="new-password" required>
      <button type="submit">Join</button>
      <p id="r-error" class="error" hidden></p>
      <p class="alt-toggle">
        <button type="button" id="show-login">back to sign in</button>
      </p>
    </form>
  </main>
  <script src="/assets/gate.js?v=13"></script>
</body>
</html>
