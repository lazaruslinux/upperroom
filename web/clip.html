<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/assets/head.js?v=2"></script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg?v=1">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=1">
  <meta name="theme-color" content="#0c0d0f">
  <!-- The gate renders /clip/<token> and swaps this whole block for tags naming
       the clip, the site, the game it was cut from, and a frame of it. What is
       written here is the fallback: if that route is ever missing, Caddy serves
       this file as it stands and the card is generic. It is also what an
       unknown or revoked token gets, which is why it names nothing. Search
       engines have no business indexing a link meant for one person. -->
  <!-- og:start -->
  <title>upperroom</title>
  <meta property="og:type" content="video.other">
  <meta property="og:title" content="A clip">
  <meta property="og:description" content="Shared from a private livestream.">
  <meta property="og:image" content="/assets/icons/og-default.png?v=1">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="robots" content="noindex, nofollow">
  <!-- og:end -->
  <link rel="stylesheet" href="/assets/style.css?v=66">
</head>
<body class="door-page">
  <!-- A still strip: this page asks the server for the clip and nothing else,
       so it carries no lamp. The site name comes from the page's own preview
       tags, which the gate already filled in. -->
  <header class="strip">
    <div class="strip-left"><span class="strip-name" id="site-title">upperroom</span></div>
    <div class="strip-on"><a class="btn" href="/">Sign in</a></div>
  </header>

  <main class="clip-main">
    <div id="loading" class="monitor">
      <div class="monitor-card"><p class="monitor-note">Loading…</p></div>
    </div>

    <div id="clip-body" hidden>
      <div class="monitor">
        <video id="clip-video" controls playsinline preload="metadata"></video>
      </div>
      <div class="clip-body">
        <h1 id="clip-title" class="media-page-title"></h1>
        <p id="clip-meta" class="media-sub"></p>
        <p class="door-fine">Shared from a private livestream. This link may stop working.</p>
      </div>
    </div>

    <div id="missing" class="monitor" hidden>
      <div class="monitor-card">
        <h1 class="monitor-word">Not available</h1>
        <p class="monitor-note">This clip is not shared any more, or the link is wrong.</p>
      </div>
    </div>
  </main>

  <footer class="site-foot">
    <img class="foot-logo" src="/assets/icons/icon.svg?v=1" alt="">
    <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener">AGPL-3.0</a>
    <span class="powered-sep" aria-hidden="true">·</span>
    <span>developed by <a href="https://lazaruslinux.com" target="_blank" rel="noopener">Lazarus Labs</a></span>
  </footer>
  <script src="/assets/clip.js?v=2"></script>
</body>
</html>
