<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem("selfstream_theme") || "dark"; } catch (e) {}
    try { document.documentElement.dataset.accent = localStorage.getItem("selfstream_accent") || "green"; } catch (e) {}
  </script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg?v=1">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=1">
  <meta name="theme-color" content="#0b0c0b">
  <!-- The gate renders /clip/<token> and swaps this whole block for tags naming
       the clip, the site, the game it was cut from, and a frame of it. What is
       written here is the fallback: if that route is ever missing, Caddy serves
       this file as it stands and the card is generic. It is also what an
       unknown or revoked token gets, which is why it names nothing. Search
       engines have no business indexing a link meant for one person. -->
  <!-- og:start -->
  <title>upperroom</title>
  <meta property="og:type" content="video.other">
  <meta property="og:title" content="A clip">
  <meta property="og:description" content="Shared from a private livestream.">
  <meta property="og:image" content="/assets/icons/og-default.png?v=1">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="robots" content="noindex, nofollow">
  <!-- og:end -->
  <link rel="stylesheet" href="/assets/style.css?v=63">
</head>
<body class="center">
  <main class="card clip-public">
    <div id="loading" class="muted">Loading…</div>

    <div id="clip-body" hidden>
      <h1 id="clip-title" class="clip-public-title"></h1>
      <p id="clip-meta" class="muted clip-public-meta"></p>
      <video id="clip-video" controls playsinline preload="metadata"></video>
      <p class="clip-public-note muted">
        Shared from a private livestream. This link may stop working.
      </p>
      <p class="alt-toggle">
        <a href="/">sign in</a>
      </p>
    </div>

    <div id="missing" hidden>
      <div class="masthead">
        <h1 class="site-title">Not available</h1>
      </div>
      <p class="muted">
        This clip is not shared any more, or the link is wrong.
      </p>
      <p class="alt-toggle">
        <a href="/">sign in</a>
      </p>
    </div>
  </main>

  <footer class="site-foot mono muted">
    <img class="foot-logo" src="/assets/icons/icon.svg?v=1" alt="" aria-hidden="true">
    <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener">AGPL-3.0</a>
    <span class="powered-sep">·</span>
    <span>developed by <a href="https://lazaruslinux.com" target="_blank" rel="noopener">Lazarus Labs</a></span>
  </footer>
  <script src="/assets/clip.js?v=1"></script>
</body>
</html>
