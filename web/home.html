<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>upperroom</title>
  <script src="/assets/head.js?v=2"></script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg?v=1">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=1">
  <link rel="manifest" href="/api/manifest.webmanifest">
  <meta name="theme-color" content="#0c0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/assets/style.css?v=66">
</head>
<body class="home">
  <div id="site-nav"></div>

  <!-- Home is the off-air place: when the last broadcast was, the way to hear
       about the next one, and what was clipped. While somebody is on air its
       one job is to send people into the room. -->
  <main class="home-main">
    <div class="monitor" id="monitor">
      <div id="offline" class="monitor-card" hidden>
        <h1 class="monitor-word">Nobody’s on air</h1>
        <p id="last-air" class="monitor-note">It shows up here the moment it goes live.</p>
      </div>
    </div>

    <div id="live-block" hidden>
      <div class="slate">
        <div class="slate-text">
          <p id="slate-title" class="slate-title">Live Stream</p>
          <p id="slate-sub" class="slate-sub" hidden></p>
        </div>
      </div>
      <div class="home-go">
        <a class="loud" href="/watch">Go to the room
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </div>

    <div id="offair" hidden>
      <div id="push-row" class="notify-row" hidden>
        <button id="push-chip" type="button" class="chip" hidden>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4l2-2Z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
          Notify me when it goes live
        </button>
        <p id="push-msg" class="notify-row-text" role="status" hidden></p>
      </div>
      <a id="last-vod" class="last-vod" hidden>
        <span class="thumb" id="last-vod-thumb"></span>
        <span><b id="last-vod-title"></b><small id="last-vod-meta"></small></span>
      </a>
    </div>

    <section class="home-clips" id="clips-section" aria-labelledby="clips-title" hidden>
      <div class="section-head">
        <h2 id="clips-title" class="engraved">Recent clips</h2>
        <a href="/browse" class="engraved">All past broadcasts</a>
      </div>
      <div id="clip-grid" class="lib-grid"></div>
    </section>
  </main>

  <footer class="site-foot">
    <img class="foot-logo" src="/assets/icons/icon.svg?v=1" alt="">
    <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener">AGPL-3.0</a>
    <span class="powered-sep" aria-hidden="true">·</span>
    <span>developed by <a href="https://lazaruslinux.com" target="_blank" rel="noopener">Lazarus Labs</a></span>
  </footer>

  <script src="/assets/nav.js?v=13"></script>
  <script src="/assets/push.js?v=1"></script>
  <script src="/assets/home.js?v=25"></script>
</body>
</html>
