<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>upperroom</title>
  <script>
    // Apply the saved theme before first paint so the page never flashes.
    try { document.documentElement.dataset.theme = localStorage.getItem("selfstream_theme") || "dark"; } catch (e) {}
    // Apply the saved accent flavor too, so the brand color never flashes.
    try { document.documentElement.dataset.accent = localStorage.getItem("selfstream_accent") || "green"; } catch (e) {}
  </script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg?v=1">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=1">
  <link rel="manifest" href="/api/manifest.webmanifest">
  <meta name="theme-color" content="#0b0c0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/assets/style.css?v=58">
</head>
<body class="home">
  <div id="site-nav"></div>

  <main class="home-main">
    <p id="greeting" class="home-greeting muted"></p>

    <!-- Divider above the stream area: a rule with a centered mono label. -->
    <div class="stream-divider"><span>live stream</span></div>

    <!-- Shown in place of the stream card while the broadcaster is offline. The
         card is hidden entirely rather than shown as a dead "no signal" tile. -->
    <div id="offline-block" class="offline-block" hidden>
      The broadcaster is currently offline.
      <a href="/watch">Enter chat</a> or view past broadcasts &amp; clips below.
    </div>

    <button id="stream-card" type="button" class="stream-card" aria-label="Join the stream">
      <div class="thumb-wrap">
        <div id="thumb-fallback" class="thumb-fallback">
          <span class="thumb-mark">no signal</span>
        </div>
        <img id="thumb" class="thumb" alt="" hidden>
        <span id="stream-badge" class="stream-badge is-offline">
          <span class="badge-dot"></span><span id="badge-label">Offline</span>
        </span>
        <span id="status-pill" class="watch-pill" hidden></span>
        <span class="play-overlay" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </span>
      </div>
      <div class="card-meta">
        <span id="card-avatar" class="card-avatar">LL</span>
        <span class="card-text">
          <span id="card-title" class="card-title">Live Stream</span>
          <span id="card-channel" class="card-channel"></span>
          <!-- What the broadcast is, between the channel and its description.
               Hidden unless the stream is live and the streamer has said. -->
          <span id="card-playing" class="card-playing" hidden></span>
          <span id="card-desc" class="card-desc">Tap to join stream and start chatting</span>
        </span>
      </div>
    </button>

    <!-- Past broadcasts and viewer clips. -->
    <section class="library">
      <div class="lib-tabs">
        <button type="button" class="lib-tab selected" data-tab="vods">Broadcasts</button>
        <button type="button" class="lib-tab" data-tab="clips">Clips</button>
      </div>
      <label id="clip-filter" class="switch lib-filter" hidden>
        <input id="mine-only" type="checkbox"> My clips only
      </label>
      <div id="lib-grid" class="lib-grid"></div>
      <p id="lib-empty" class="muted" hidden></p>
    </section>
  </main>

  <!-- The one-time notice after an upgrade. Filled and shown by home.js only
       when the server says this viewer has not read the running release's
       notes; there is never more than one, and never one per missed version. -->
  <div id="whats-new" class="modal" hidden>
    <div class="modal-card whats-new-card">
      <h3 id="whats-new-title">upperroom has been updated</h3>
      <ul id="whats-new-list" class="whats-new-list"></ul>
      <div class="crop-actions">
        <button type="button" id="whats-new-ok" class="pill primary">Got it</button>
      </div>
    </div>
  </div>

  <footer class="site-foot mono muted">
    <img class="foot-logo" src="/assets/icons/icon.svg?v=1" alt="" aria-hidden="true">
    <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener">AGPL-3.0</a>
    <span class="powered-sep">·</span>
    <span>developed by <a href="https://lazaruslinux.com" target="_blank" rel="noopener">Lazarus Labs</a></span>
  </footer>

  <script src="/assets/nav.js?v=7"></script>
  <script src="/assets/home.js?v=22"></script>
</body>
</html>
