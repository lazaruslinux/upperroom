<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>upperroom</title>
  <script>
    // Apply the saved theme before first paint so the page never flashes.
    try { document.documentElement.dataset.theme = localStorage.getItem("selfstream_theme") || "dark"; } catch (e) {}
    // Apply the saved accent flavor too, so the brand color never flashes.
    try { document.documentElement.dataset.accent = localStorage.getItem("selfstream_accent") || "green"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/assets/style.css?v=25">
</head>
<body class="home">
  <header class="home-bar">
    <div class="brand brand-column">
      <span id="site-title">upperroom</span>
      <span class="powered">powered by <span class="wordmark">upper<span class="wm-accent">room</span><span class="cursor">▮</span></span></span>
    </div>
    <nav class="home-actions">
      <button id="settings-btn" type="button" class="ghost-btn">settings</button>
      <a id="mod-link" href="/mod" class="ghost-btn" hidden>mod</a>
      <a id="admin-link" href="/admin" class="ghost-btn" hidden>admin</a>
      <button id="logout" type="button" class="ghost-btn">sign out</button>
    </nav>
  </header>

  <main class="home-main">
    <p id="greeting" class="home-greeting muted"></p>

    <button id="stream-card" type="button" class="stream-card" aria-label="Join the stream">
      <div class="thumb-wrap">
        <div id="thumb-fallback" class="thumb-fallback">
          <span class="thumb-mark">no signal</span>
        </div>
        <img id="thumb" class="thumb" alt="" hidden>
        <span id="stream-badge" class="stream-badge is-offline">
          <span class="badge-dot"></span><span id="badge-label">Offline</span>
        </span>
        <span id="status-pill" class="watch-pill" hidden></span>
        <span class="play-overlay" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </span>
      </div>
      <div class="card-meta">
        <span id="card-avatar" class="card-avatar">LL</span>
        <span class="card-text">
          <span id="card-title" class="card-title">Live Stream</span>
          <span id="card-channel" class="card-channel"></span>
          <span id="card-desc" class="card-desc">Tap to join stream and start chatting</span>
        </span>
      </div>
    </button>

    <!-- Past broadcasts and viewer clips. -->
    <section class="library">
      <div class="lib-tabs">
        <button type="button" class="lib-tab selected" data-tab="vods">VODs</button>
        <button type="button" class="lib-tab" data-tab="clips">Clips</button>
      </div>
      <label id="clip-filter" class="switch lib-filter" hidden>
        <input id="mine-only" type="checkbox"> My clips only
      </label>
      <div id="lib-grid" class="lib-grid"></div>
      <p id="lib-empty" class="muted" hidden></p>
    </section>
  </main>

  <!-- Your account / profile settings -->
  <div id="user-modal" class="modal" hidden>
    <div class="modal-card admin-modal">
      <button class="modal-close" type="button" data-close aria-label="Close">&times;</button>
      <h3>Your settings</h3>

      <div class="setting">
        <span>Theme</span>
        <button id="theme-toggle" type="button" class="pill">Dark</button>
      </div>
      <div class="setting setting-name">
        <span>Go-live email</span>
        <div class="name-edit">
          <input id="email-input" type="email" placeholder="name@example.com" autocomplete="email">
          <button id="email-save" type="button" class="pill">Save</button>
        </div>
      </div>
      <div class="setting setting-check">
        <label class="switch">
          <input id="notify-toggle" type="checkbox">
          Receive an email when streams start
        </label>
      </div>
      <div class="setting setting-name">
        <span>Display name</span>
        <div class="name-edit">
          <input id="name-input" type="text" maxlength="40" placeholder="Shown in chat" autocomplete="off">
          <button id="name-save" type="button" class="pill">Save</button>
        </div>
      </div>
      <div class="setting">
        <span>Avatar</span>
        <span class="avatar-edit">
          <span id="my-avatar"></span>
          <button id="avatar-button" type="button" class="pill">Change</button>
          <input id="avatar-input" type="file" accept="image/*" hidden>
        </span>
      </div>
      <div class="setting setting-bio">
        <span>Bio</span>
        <div class="bio-edit">
          <textarea id="bio-input" maxlength="200" rows="2" placeholder="A short bio others see when they tap your avatar"></textarea>
          <button id="bio-save" type="button" class="pill">Save</button>
        </div>
      </div>
      <div class="setting">
        <span>Password</span>
        <button id="pw-open" type="button" class="pill">Change password</button>
      </div>
    </div>
  </div>

  <!-- Change password -->
  <div id="password-modal" class="modal" hidden>
    <div class="modal-card">
      <button class="modal-close" type="button" data-close aria-label="Close">&times;</button>
      <h3>Change password</h3>
      <div class="pw-edit">
        <input id="pw-current" type="password" placeholder="Current password" autocomplete="current-password">
        <input id="pw-new" type="password" placeholder="New password (8+ characters)" autocomplete="new-password">
        <div class="pw-row">
          <button id="pw-save" type="button" class="pill primary">Change password</button>
          <span id="pw-msg" class="pw-msg"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- First-login nudge to add a go-live email (only if none on file) -->
  <div id="email-modal" class="modal" hidden>
    <div class="modal-card">
      <h3>Get a heads-up when the stream goes live?</h3>
      <p class="muted">Add your email and we'll let you know when the channel goes live. You can change or remove it anytime in Settings.</p>
      <input id="email-prompt-input" type="email" placeholder="name@example.com" autocomplete="email">
      <p id="email-prompt-msg" class="pw-msg"></p>
      <div class="crop-actions">
        <button id="email-ignore" type="button" class="pill" data-close>Not now</button>
        <button id="email-prompt-save" type="button" class="pill primary">Save</button>
      </div>
    </div>
  </div>

  <!-- Avatar crop (drag + zoom) -->
  <div id="crop-modal" class="modal" hidden>
    <div class="modal-card crop-card">
      <div class="crop-stage">
        <canvas id="crop-canvas" width="256" height="256"></canvas>
        <div class="crop-ring"></div>
      </div>
      <input id="crop-zoom" type="range" min="1" max="3" step="0.01" value="1" aria-label="Zoom">
      <div class="crop-actions">
        <button type="button" class="pill" data-close>Cancel</button>
        <button id="crop-save" type="button" class="pill primary">Save</button>
      </div>
    </div>
  </div>

  <script src="/assets/home.js?v=11"></script>
</body>
</html>
