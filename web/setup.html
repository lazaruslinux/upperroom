<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>upperroom - setup</title>
  <script>
    // Apply the saved theme before first paint so the page never flashes.
    try { document.documentElement.dataset.theme = localStorage.getItem("selfstream_theme") || "dark"; } catch (e) {}
    // Apply the saved accent flavor too, so the brand color never flashes.
    try { document.documentElement.dataset.accent = localStorage.getItem("selfstream_accent") || "green"; } catch (e) {}
  </script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg?v=1">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=1">
  <link rel="manifest" href="/api/manifest.webmanifest">
  <meta name="theme-color" content="#0b0c0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/assets/style.css?v=28">
</head>
<body class="center">
  <main class="card">
    <h1 class="brand"><span class="wordmark">upper<span class="wm-accent">room</span></span></h1>
    <p class="muted">first-run setup</p>
    <p class="setup-intro muted">This creates the first account as the admin and names the site. It runs only once.</p>
    <form id="setup-form" autocomplete="off">
      <input type="text" id="username" placeholder="Username" autocomplete="off" required>
      <input type="text" id="display-name" placeholder="Display name" autocomplete="off" required>
      <input type="password" id="password" placeholder="Password (at least 8 characters)" autocomplete="new-password" required>
      <input type="text" id="site-name" placeholder="Site name (your brand)" maxlength="60" autocomplete="off" required>
      <button type="submit">Create admin</button>
      <p id="error" class="error" hidden></p>
    </form>
  </main>
  <script src="/assets/setup.js?v=3"></script>
</body>
</html>
