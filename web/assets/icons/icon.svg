<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="upperroom">
  <!-- The mark: a lowercase u on the app's near-black surface, in the default
       accent. Drawn as a stroked path rather than text so it renders the same
       everywhere, with no font to load, and stays legible at favicon size.
       Square canvas with square corners; every platform applies its own mask. -->
  <rect width="512" height="512" fill="#0b0c0b"/>
  <path d="M170 146 V290 A86 86 0 0 0 342 290 V146"
        fill="none" stroke="#6ab48a" stroke-width="56"/>
</svg>
