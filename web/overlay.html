  <title>upperroom - overlay</title>

       would otherwise name that address in its Referer. -->

       of the broadcast video, so its own background is transparent; that
       override lives in overlay.css, which no other page loads. -->

  <link rel="stylesheet" href="/assets/overlay.css?v=1">
</head>

  <script src="/assets/overlay.js?v=7"></script>
