<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lazarus Labs</title>
  <script>
    // Apply the saved theme before first paint so the page never flashes.
    try { document.documentElement.dataset.theme = localStorage.getItem("selfstream_theme") || "dark"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/assets/style.css?v=8">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body class="watch">
  <section class="stage">
    <div id="offline" class="offline" hidden>
      <p>The stream is offline right now.</p>
      <p class="muted">This will start playing on its own when it goes live.</p>
    </div>
    <video id="video" controls autoplay playsinline muted></video>
    <button id="unmute" class="unmute" hidden>Tap for sound</button>
  </section>

  <aside class="chat">
    <header class="chat-head">
      <a href="/home" class="icon-btn" aria-label="Back to home">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 11l9-8 9 8"></path><path d="M5 10v10h14V10"></path>
        </svg>
      </a>
      <button id="viewer-toggle" type="button">
        <span id="viewer-count">0 watching</span>
      </button>
      <button id="settings-toggle" type="button" class="icon-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>
    <div id="settings-panel" class="settings-panel" hidden>
      <p class="settings-heading muted">Stream &amp; chat</p>
      <div class="setting">
        <span>Theme</span>
        <button id="theme-toggle" type="button" class="pill">Dark</button>
      </div>
      <div class="setting setting-font">
        <span>Chat font</span>
        <div id="font-picker" class="font-picker"></div>
      </div>
      <p class="settings-note muted">Account settings like your avatar, bio, and password are on the home page.</p>
    </div>
    <ul id="viewer-list" class="viewer-list" hidden></ul>
    <div id="messages" class="messages"></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" maxlength="500" placeholder="Say something" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </aside>

  <div id="profile-modal" class="modal" hidden>
    <div class="modal-card profile-card">
      <button class="modal-close" type="button" data-close aria-label="Close">&times;</button>
      <span id="profile-avatar" class="profile-avatar"></span>
      <div id="profile-name" class="profile-name"></div>
      <div id="profile-bio" class="profile-bio muted"></div>
    </div>
  </div>

  <script src="/assets/watch.js?v=9"></script>
</body>
</html>
