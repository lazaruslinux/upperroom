<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lazarus Labs</title>
  <script>
    // Apply the saved theme before first paint so the page never flashes.
    try { document.documentElement.dataset.theme = localStorage.getItem("selfstream_theme") || "dark"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/assets/style.css?v=3">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body class="watch">
  <section class="stage">
    <div id="offline" class="offline" hidden>
      <p>The stream is offline right now.</p>
      <p class="muted">This will start playing on its own when it goes live.</p>
    </div>
    <video id="video" controls autoplay playsinline muted></video>
    <button id="unmute" class="unmute" hidden>Tap for sound</button>
  </section>

  <aside class="chat">
    <header class="chat-head">
      <button id="viewer-toggle" type="button">
        <span id="viewer-count">0 watching</span>
      </button>
      <button id="settings-toggle" type="button" class="icon-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>
    <div id="settings-panel" class="settings-panel" hidden>
      <div class="setting">
        <span>Theme</span>
        <button id="theme-toggle" type="button" class="pill">Dark</button>
      </div>
      <div class="setting setting-font">
        <span>Chat font</span>
        <div id="font-picker" class="font-picker"></div>
      </div>
      <div class="setting">
        <span>Avatar</span>
        <span class="avatar-edit">
          <span id="my-avatar"></span>
          <button id="avatar-button" type="button" class="pill">Change</button>
          <input id="avatar-input" type="file" accept="image/*" hidden>
        </span>
      </div>
      <div class="setting setting-bio">
        <span>Bio</span>
        <div class="bio-edit">
          <textarea id="bio-input" maxlength="200" rows="2" placeholder="A short bio others see when they tap your avatar"></textarea>
          <button id="bio-save" type="button" class="pill">Save</button>
        </div>
      </div>
    </div>
    <ul id="viewer-list" class="viewer-list" hidden></ul>
    <div id="messages" class="messages"></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" maxlength="500" placeholder="Say something" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </aside>

  <div id="profile-modal" class="modal" hidden>
    <div class="modal-card profile-card">
      <button class="modal-close" type="button" data-close aria-label="Close">&times;</button>
      <span id="profile-avatar" class="profile-avatar"></span>
      <div id="profile-name" class="profile-name"></div>
      <div id="profile-bio" class="profile-bio muted"></div>
    </div>
  </div>

  <div id="crop-modal" class="modal" hidden>
    <div class="modal-card crop-card">
      <div class="crop-stage">
        <canvas id="crop-canvas" width="256" height="256"></canvas>
        <div class="crop-ring"></div>
      </div>
      <input id="crop-zoom" type="range" min="1" max="3" step="0.01" value="1" aria-label="Zoom">
      <div class="crop-actions">
        <button type="button" class="pill" data-close>Cancel</button>
        <button id="crop-save" type="button" class="pill primary">Save</button>
      </div>
    </div>
  </div>

  <script src="/assets/watch.js?v=6"></script>
</body>
</html>
