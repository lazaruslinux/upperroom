<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>upperroom - admin</title>
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem("selfstream_theme") || "dark"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/assets/style.css?v=15">
</head>
<body class="admin">
  <header class="home-bar">
    <div class="brand">upperroom<span class="cursor">▮</span> <span class="admin-tag">admin</span></div>
    <nav class="home-actions">
      <a href="/home" class="ghost-btn">home</a>
      <button id="new-user" type="button" class="solid-btn">+ new user</button>
    </nav>
  </header>

  <main class="admin-main">
    <section class="stat-strip" id="stat-strip"></section>

    <h2 class="section-title">Accounts</h2>
    <div id="user-grid" class="user-grid"></div>
    <p id="empty" class="muted" hidden>No accounts yet. Create one with “New user”.</p>

    <h2 class="section-title" style="margin-top:1.75rem;">Bans</h2>
    <div id="ban-list" class="activity-list"></div>
    <p id="ban-empty" class="muted" hidden>No active bans.</p>

    <h2 class="section-title" style="margin-top:1.75rem;">Channel</h2>
    <div class="notify-panel">
      <label>Stream title
        <input id="ch-title" type="text" maxlength="100" placeholder="What you're streaming" autocomplete="off">
      </label>
      <label>Description
        <textarea id="ch-desc" maxlength="500" rows="2" placeholder="Shown on the home card"></textarea>
      </label>
      <span class="muted">Clip cooldown — minutes between clips per role (0 = off)</span>
      <div class="clip-limit-edit">
        <label>Viewers <input id="ch-cd-user" type="number" min="0" max="1440" inputmode="numeric"></label>
        <label>Mods <input id="ch-cd-mod" type="number" min="0" max="1440" inputmode="numeric"></label>
        <label>Admin <input id="ch-cd-admin" type="number" min="0" max="1440" inputmode="numeric"></label>
      </div>
      <div class="edit-actions">
        <button type="button" id="ch-save" class="solid-btn">Save channel settings</button>
      </div>
      <p id="ch-msg" class="notify-msg" hidden></p>
    </div>

    <h2 class="section-title" style="margin-top:1.75rem;">Go-live notifications</h2>
    <div class="notify-panel">
      <p id="notify-status" class="muted">Loading…</p>
      <label>Discord webhook URL <span class="muted">(optional)</span>
        <input id="notify-webhook" type="text" placeholder="https://discord.com/api/webhooks/…" autocomplete="off">
      </label>
      <div class="edit-actions">
        <button type="button" id="notify-test" class="ghost-btn">Send test</button>
        <button type="button" id="notify-save" class="solid-btn">Save</button>
      </div>
      <p id="notify-msg" class="notify-msg" hidden></p>
    </div>

    <h2 class="section-title" style="margin-top:1.75rem;">Content</h2>
    <div class="lib-tabs">
      <button type="button" class="lib-tab selected" data-content="vods">VODs</button>
      <button type="button" class="lib-tab" data-content="clips">Clips</button>
    </div>
    <div id="content-list" class="activity-list"></div>
    <p id="content-empty" class="muted" hidden>Nothing here yet.</p>
  </main>

  <!-- Create user -->
  <div id="create-modal" class="modal" hidden>
    <div class="modal-card admin-modal">
      <button class="modal-close" type="button" data-close aria-label="Close">&times;</button>
      <h3>New account</h3>
      <form id="create-form" class="admin-form" autocomplete="off">
        <label>Username
          <input id="c-username" type="text" placeholder="lowercase, no spaces" autocomplete="off" required>
        </label>
        <label>Display name <span class="muted">(optional)</span>
          <input id="c-name" type="text" placeholder="Shown in chat" autocomplete="off">
        </label>
        <label>Email <span class="muted">(optional, for go-live alerts)</span>
          <input id="c-email" type="email" placeholder="name@example.com" autocomplete="off">
        </label>
        <label>Password
          <input id="c-password" type="text" placeholder="at least 8 characters" autocomplete="new-password" required>
        </label>
        <label class="checkrow">
          <input id="c-admin" type="checkbox"> Make this account an admin
        </label>
        <label class="checkrow">
          <input id="c-mod" type="checkbox"> Make this account a moderator
        </label>
        <label class="checkrow">
          <input id="c-notify" type="checkbox" checked> Email this person when the stream goes live
        </label>
        <p id="c-error" class="error" hidden></p>
        <button type="submit" class="solid-btn">Create account</button>
      </form>
    </div>
  </div>

  <!-- Edit user -->
  <div id="edit-modal" class="modal" hidden>
    <div class="modal-card admin-modal">
      <button class="modal-close" type="button" data-close aria-label="Close">&times;</button>
      <h3 id="e-title">Edit account</h3>
      <form id="edit-form" class="admin-form" autocomplete="off">
        <label>Display name
          <input id="e-name" type="text" autocomplete="off">
        </label>
        <label>Email <span class="muted">(for go-live alerts)</span>
          <input id="e-email" type="email" placeholder="name@example.com" autocomplete="off">
        </label>
        <label>Reset password <span class="muted">(leave blank to keep)</span>
          <input id="e-password" type="text" placeholder="new password" autocomplete="new-password">
        </label>
        <label class="checkrow">
          <input id="e-admin" type="checkbox"> Admin
        </label>
        <label class="checkrow">
          <input id="e-mod" type="checkbox"> Moderator
        </label>
        <label class="checkrow">
          <input id="e-notify" type="checkbox"> Email this person when the stream goes live
        </label>
        <p id="e-error" class="error" hidden></p>
        <div class="edit-actions">
          <button type="button" id="e-delete" class="danger-btn">Delete</button>
          <button type="submit" class="solid-btn">Save changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Activity drawer -->
  <div id="activity-modal" class="modal" hidden>
    <div class="modal-card admin-modal activity-modal">
      <button class="modal-close" type="button" data-close aria-label="Close">&times;</button>
      <h3 id="a-title">Activity</h3>
      <div class="activity-tabs">
        <button type="button" class="tab selected" data-tab="watch">Watch history</button>
        <button type="button" class="tab" data-tab="chat">Chat history</button>
      </div>
      <div id="a-watch" class="activity-list"></div>
      <div id="a-chat" class="activity-list" hidden></div>
    </div>
  </div>

  <!-- Stat detail (tap a stat card) -->
  <div id="stat-modal" class="modal" hidden>
    <div class="modal-card admin-modal activity-modal">
      <button class="modal-close" type="button" data-close aria-label="Close">&times;</button>
      <h3 id="stat-title">Details</h3>
      <div id="stat-body" class="activity-list"></div>
    </div>
  </div>

  <script src="/assets/admin.js?v=5"></script>
</body>
</html>
