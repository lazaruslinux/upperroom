<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>upperroom</title>
  <script>
    // Apply the saved theme before first paint so the page never flashes.
    try { document.documentElement.dataset.theme = localStorage.getItem("selfstream_theme") || "dark"; } catch (e) {}
    // Apply the saved accent flavor too, so the brand color never flashes.
    try { document.documentElement.dataset.accent = localStorage.getItem("selfstream_accent") || "green"; } catch (e) {}
  </script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg?v=1">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=1">
  <link rel="manifest" href="/api/manifest.webmanifest">
  <meta name="theme-color" content="#0b0c0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- This page is reachable without signing in, so it gets the same share
       card the login page does. It deliberately says nothing about who is
       streaming or that guest passes exist. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="upperroom">
  <meta property="og:description" content="A private livestream.">
  <meta property="og:image" content="/assets/icons/og-default.png?v=1">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/style.css?v=36">
</head>
<body class="center">
  <main class="card">
    <div id="status" class="status status-loading">
      <span class="dot"></span>
      <span id="status-label">Checking status…</span>
      <span id="status-time" class="status-time"></span>
    </div>
    <div class="masthead">
      <h1 class="site-title" id="site-title">upperroom</h1>
      <p class="powered">livestream powered by <span class="wordmark">upper<span class="wm-accent">room</span></span></p>
    </div>
    <p class="muted">use a guest pass</p>

    <form id="guest-form" autocomplete="off">
      <input type="text" id="g-code" placeholder="Guest pass code" autocomplete="off" required>
      <input type="text" id="g-name" placeholder="Name to show in chat" autocomplete="off" maxlength="24" required>
      <label class="guest-challenge" for="g-answer">
        <span id="g-question">Loading a question…</span>
      </label>
      <input type="text" id="g-answer" placeholder="Answer" autocomplete="off" required>
      <button type="submit" id="g-submit">Start watching</button>
      <p id="g-error" class="error" hidden></p>
    </form>

    <p class="guest-note muted">
      A guest pass lets you watch and chat for <span id="g-minutes">30</span> minutes.
      It works once, and it starts when you press the button.
    </p>

    <p class="alt-toggle">
      <a href="/">have an account? sign in</a>
    </p>
  </main>
  <script src="/assets/guest.js?v=1"></script>
</body>
</html>
