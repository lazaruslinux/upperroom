<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>upperroom</title>
  <script src="/assets/head.js?v=2"></script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg?v=1">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=1">
  <link rel="manifest" href="/api/manifest.webmanifest">
  <meta name="theme-color" content="#0c0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/assets/style.css?v=66">
</head>
<body class="browse">
  <div id="site-nav"></div>

  <main class="page page-wide">
    <h1 class="page-title">Past broadcasts</h1>

    <div class="browse-bar">
      <div class="tabs" role="tablist" aria-label="What to show">
        <button type="button" class="lib-tab selected" role="tab" aria-selected="true" data-tab="vods">Broadcasts</button>
        <button type="button" class="lib-tab" role="tab" aria-selected="false" data-tab="clips">Clips</button>
      </div>
      <!-- Titles only, matched in the browser across both kinds: the listings
           are small and already fetched whole for the grid. -->
      <div class="browse-search">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="lib-search" type="search" maxlength="64" autocomplete="off" placeholder="Search broadcasts and clips" aria-label="Search broadcasts and clips">
      </div>
    </div>
    <label id="clip-filter" class="checkrow lib-filter" hidden>
      <input id="mine-only" type="checkbox"> My clips only
    </label>

    <div id="lib-grid" class="lib-grid"></div>
    <p id="lib-empty" class="lib-empty" hidden></p>
  </main>

  <footer class="site-foot">
    <img class="foot-logo" src="/assets/icons/icon.svg?v=1" alt="">
    <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener">AGPL-3.0</a>
    <span class="powered-sep" aria-hidden="true">·</span>
    <span>developed by <a href="https://lazaruslinux.com" target="_blank" rel="noopener">Lazarus Labs</a></span>
  </footer>

  <script src="/assets/nav.js?v=13"></script>
  <script src="/assets/browse.js?v=2"></script>
</body>
</html>
