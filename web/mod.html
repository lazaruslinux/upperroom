<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>upperroom - moderation</title>
  <script src="/assets/head.js?v=2"></script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg?v=1">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=1">
  <link rel="manifest" href="/api/manifest.webmanifest">
  <meta name="theme-color" content="#0c0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/assets/style.css?v=65">
  <link rel="stylesheet" href="/assets/dash.css?v=2">
</head>
<body class="dash">
  <div id="site-nav"></div>

  <main class="dash-main">
    <div class="dash-page">
      <h1 class="page-title">Moderation</h1>

      <!-- The numbers this page can stand behind: who has an account, who is
           barred, and how much has been said in the week chat is kept. -->
      <div class="meter-row" id="meters">
        <div class="meter"><span class="engraved">Viewers</span><strong id="m-viewers">0</strong></div>
        <div class="meter"><span class="engraved">Active bans</span><strong id="m-bans">0</strong></div>
        <button type="button" class="meter" id="m-chat" aria-label="Messages in the last 7 days. Read them">
          <span class="engraved">Messages, 7 days</span><strong id="m-messages">0</strong>
        </button>
      </div>

      <section class="dash-group" aria-labelledby="viewers-title">
        <div class="group-head">
          <h2 id="viewers-title" class="engraved">Viewers</h2>
          <button type="button" id="chat-open" class="btn">Recent chat</button>
        </div>
        <ul id="user-grid" class="rows" aria-labelledby="viewers-title"></ul>
        <p id="empty" class="empty" hidden>No viewers yet.</p>
      </section>

      <section class="dash-group" aria-labelledby="bans-title">
        <div class="group-head">
          <h2 id="bans-title" class="engraved">Bans</h2>
        </div>
        <ul id="ban-list" class="rows" aria-labelledby="bans-title"></ul>
        <p id="ban-empty" class="empty" hidden>Nobody is banned.</p>
      </section>
    </div>
  </main>

  <footer class="site-foot">
    <img class="foot-logo" src="/assets/icons/icon.svg?v=1" alt="">
    <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener">AGPL-3.0</a>
    <span class="powered-sep" aria-hidden="true">·</span>
    <span>developed by <a href="https://lazaruslinux.com" target="_blank" rel="noopener">Lazarus Labs</a></span>
  </footer>

  <!-- One viewer's watch and chat history. -->
  <div id="activity-modal" class="modal" hidden>
    <div class="modal-card dash-modal" role="dialog" aria-modal="true" aria-labelledby="a-title">
      <button class="modal-close" type="button" data-close aria-label="Close">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <h3 id="a-title">Activity</h3>
      <div class="tabs activity-tabs" role="group" aria-label="Show">
        <button type="button" class="tab selected" data-tab="watch" aria-pressed="true">Watch</button>
        <button type="button" class="tab" data-tab="chat" aria-pressed="false">Chat</button>
      </div>
      <ul id="a-watch" class="rows activity-list"></ul>
      <ul id="a-chat" class="rows activity-list" hidden></ul>
    </div>
  </div>

  <!-- The whole room's chat, as far back as it is kept. -->
  <div id="chat-modal" class="modal" hidden>
    <div class="modal-card dash-modal" role="dialog" aria-modal="true" aria-labelledby="chat-title">
      <button class="modal-close" type="button" data-close aria-label="Close">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <h3 id="chat-title">Recent chat</h3>
      <ul id="chat-body" class="rows activity-list"></ul>
    </div>
  </div>

  <script src="/assets/nav.js?v=12"></script>
  <script src="/assets/mod.js?v=6"></script>
</body>
</html>
