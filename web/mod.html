<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mod · Lazarus Labs</title>
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem("selfstream_theme") || "dark"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/assets/style.css?v=14">
</head>
<body class="admin">
  <header class="home-bar">
    <div class="brand">Lazarus<span>Labs</span> <span class="admin-tag">Mod</span></div>
    <nav class="home-actions">
      <a href="/home" class="ghost-btn">Home</a>
    </nav>
  </header>

  <main class="admin-main">
    <section class="stat-strip" id="stat-strip"></section>

    <h2 class="section-title">Viewers</h2>
    <div id="user-grid" class="user-grid"></div>
    <p id="empty" class="muted" hidden>No viewers yet.</p>

    <h2 class="section-title" style="margin-top:1.75rem;">Bans</h2>
    <div id="ban-list" class="activity-list"></div>
    <p id="ban-empty" class="muted" hidden>No active bans.</p>
  </main>

  <!-- Activity drawer (watch + chat history for one viewer) -->
  <div id="activity-modal" class="modal" hidden>
    <div class="modal-card admin-modal activity-modal">
      <button class="modal-close" type="button" data-close aria-label="Close">&times;</button>
      <h3 id="a-title">Activity</h3>
      <div class="activity-tabs">
        <button type="button" class="tab selected" data-tab="watch">Watch history</button>
        <button type="button" class="tab" data-tab="chat">Chat history</button>
      </div>
      <div id="a-watch" class="activity-list"></div>
      <div id="a-chat" class="activity-list" hidden></div>
    </div>
  </div>

  <!-- Global recent chat -->
  <div id="chat-modal" class="modal" hidden>
    <div class="modal-card admin-modal activity-modal">
      <button class="modal-close" type="button" data-close aria-label="Close">&times;</button>
      <h3>Recent chat</h3>
      <div id="chat-body" class="activity-list"></div>
    </div>
  </div>

  <script src="/assets/mod.js?v=1"></script>
</body>
</html>
